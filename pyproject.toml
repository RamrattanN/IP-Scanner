[project]
name = "network-analysis-tool"
version = "1.0.0"
description = "Local network analysis tool with FastAPI UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Your Name" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "psutil>=6.0.0",
    "rich>=13.7.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
