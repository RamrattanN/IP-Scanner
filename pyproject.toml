[project]
name = "network-analysis-tool"
version = "1.1.1"
description = "Local network analysis tool with FastAPI UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nilesh Ramrattan" }]
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "psutil>=6.0.0",
    "rich>=13.7.1",
    "mac-vendor-lookup>=0.1.15,<0.2",
]

[project.optional-dependencies]
test = [
    "build>=1.2.2",
    "pytest>=8.0",
]
desktop-release = [
    "pyinstaller>=6.10",
    "pillow>=10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
network_scanner = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
