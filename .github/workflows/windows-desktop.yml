name: Build Windows x64 desktop QA package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "IPScannerWindows.spec"
      - "installer/windows/**"
      - "scripts/build_windows_*"
      - "pyproject.toml"
      - "src/network_scanner/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and release tools
        run: python -m pip install -e ".[test,desktop-release]"
      - name: Run tests
        run: pytest -q
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build unsigned application and installer
        shell: pwsh
        run: ./scripts/build_windows_release.ps1
      - name: Install and smoke-test packaged service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $PWD "dist\IP-Scanner-Windows-x64-1.1.1.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "IPScanner"
          $dataDir = Join-Path $env:RUNNER_TEMP "ip-scanner-data"
          $install = Start-Process $installer -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir"
          )
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)." }
          $app = Join-Path $installDir "IP Scanner.exe"
          if ((Get-Item $app).VersionInfo.ProductVersion -ne "1.1.1") { throw "Unexpected product version." }
          $service = Start-Process $app -PassThru -ArgumentList @("--service", "--port", "8766", "--data-dir", $dataDir)
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($service.HasExited) { break }
              try {
                $ping = Invoke-RestMethod "http://127.0.0.1:8766/api/ping"
                $schedule = Invoke-RestMethod "http://127.0.0.1:8766/api/schedule"
                if (($ping.status -eq "ok") -and ($schedule.interval_minutes -eq 60)) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw "The installed scanner did not become ready." }
          } finally {
            if (-not $service.HasExited) { Stop-Process -Id $service.Id -Force }
          }
          $marker = Join-Path $dataDir "preserve-after-uninstall.txt"
          Set-Content $marker "preserve"
          $uninstaller = Join-Path $installDir "unins000.exe"
          Start-Process $uninstaller -Wait -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART")
          if (Test-Path $app) { throw "Uninstall did not remove the application." }
          if (-not (Test-Path $marker)) { throw "Uninstall removed user scan data." }
      - uses: actions/upload-artifact@v4
        with:
          name: IP-Scanner-Windows-x64-1.1.1
          path: dist/IP-Scanner-Windows-x64-1.1.1.exe
          if-no-files-found: error
          retention-days: 14
