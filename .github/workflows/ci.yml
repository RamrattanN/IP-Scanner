name: CI

on:
  push:
    branches: [main, recovery/cross-platform-desktop]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and tests
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile source
        run: python -m compileall -q src

  package-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in isolation
        run: |
          python -m venv .smoke-venv
          .smoke-venv/bin/python -m pip install dist/*.whl
      - name: Verify application and packaged UI
        run: |
          .smoke-venv/bin/python -c "from network_scanner.app import app; assert app.title == 'Ramrattan IP Scanner'"
          .smoke-venv/bin/python -c "from importlib.resources import files; assert files('network_scanner').joinpath('ui/index.html').is_file()"
          .smoke-venv/bin/python -c "from network_scanner.vendors import lookup_mac_vendor; assert lookup_mac_vendor('00:11:22:33:44:55')"
